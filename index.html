<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Claviculário Digital</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="tela-app" hidden>
    <header class="topo">
      <div class="marca"><img src="icone.svg" alt="" width="28" height="28"> Claviculário</div>
      <nav id="menu">
        <a href="#painel">Controle</a>
        <a href="#historico">Cautelas</a>
        <a href="#temporarias">Temporárias</a>
        <a href="#servicos">Serviços</a>
        <a href="#militares">Militares</a>
        <a href="#viaturas">Viaturas</a>
        <a href="#backup">Backup</a>
        <a href="#auditoria">Auditoria</a>
      </nav>
      <div class="usuario">
        <button class="btn monitor-btn" id="btn-monitor" title="Abrir o monitor na segunda tela">🖥 Monitor</button>
      </div>
    </header>
    <div class="faixa-servico" id="faixa-servico"></div>
    <main id="conteudo"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-corpo" id="modal-form">
      <header><h2 id="modal-titulo"></h2><button type="button" class="btn link fechar" aria-label="Fechar">✕</button></header>
      <div id="modal-conteudo"></div>
      <p class="erro" id="modal-erro"></p>
      <footer id="modal-acoes"></footer>
    </form>
  </dialog>
  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="js/armazenamento.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/assinatura.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Claviculário Digital</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f3a5f%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2226%22%20r%3D%2211%22%20fill%3D%22none%22%20stroke%3D%22%23f2c14e%22%20stroke-width%3D%225%22%2F%3E%3Cpath%20d%3D%22M32%2033l18%2018m-6-6l5-5m-10%200l4-4%22%20stroke%3D%22%23f2c14e%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <style>
:root {
  --fundo: #f3f5f8; --cartao: #fff; --texto: #1b2430; --suave: #5d6b7c; --borda: #d9dfe7;
  --primaria: #1f3a5f; --primaria-texto: #fff; --destaque: #f2c14e;
  --ok: #1f8a4c; --ok-bg: #e5f5ec; --alerta: #b7791f; --alerta-bg: #fdf3e1; --perigo: #c0392b; --perigo-bg: #fbe9e7;
  --raio: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fundo: #10151c; --cartao: #19212b; --texto: #e6ebf1; --suave: #9aa8b8; --borda: #2c3846;
    --primaria: #3d6ea8; --ok: #4cc37d; --ok-bg: #16301f; --alerta: #e2a84a; --alerta-bg: #33270f;
    --perigo: #ef6f5f; --perigo-bg: #3a1a16; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
[hidden] { display: none !important; }
a { color: var(--primaria); }
h1 { font-size: 1.35rem; margin: 0; }
small, .sub { color: var(--suave); }
.sub { margin: 0 0 12px; }

.btn { font: inherit; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
.btn:hover { border-color: var(--primaria); }
.btn.primario { background: var(--primaria); border-color: var(--primaria); color: var(--primaria-texto); }
.btn.link { border: 0; background: none; padding: 4px 8px; color: inherit; }
.btn.pequeno { padding: 4px 10px; font-size: .85rem; }
.btn:disabled { opacity: .6; cursor: wait; }

input, select { font: inherit; width: 100%; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--cartao); color: var(--texto); }
label { display: block; margin-bottom: 12px; font-weight: 500; }
label > input, label > select { margin-top: 4px; font-weight: 400; }
label.check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
label.check input { width: auto; margin: 0; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.erro { color: var(--perigo); min-height: 1.2em; margin: 8px 0 0; }
.cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); padding: 24px; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: linear-gradient(160deg, var(--primaria), #0b1f3a); }
.login-cartao { width: min(360px, 100%); text-align: center; }
.login-cartao label { text-align: left; }
.login-cartao h1 { margin: 8px 0 20px; }
.login-cartao .btn { width: 100%; padding: 11px; }

/* topo */
.topo { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--primaria); color: #fff; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 700; }
#menu { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
#menu a { color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 6px; opacity: .85; white-space: nowrap; }
#menu a.ativo, #menu a:hover { background: rgba(255,255,255,.15); opacity: 1; }
.usuario { display: flex; align-items: center; gap: 4px; font-size: .9rem; }
main { padding: 20px 16px 40px; max-width: 1280px; margin: 0 auto; }

.cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.filtros input[type=search] { width: 260px; max-width: 100%; }
.filtros select { width: auto; }
.filtros.barra { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px; margin-bottom: 16px; }
.filtros.barra label { margin: 0; }

/* totais e grade */
:root { --verde: #1e8e4a; --amarelo: #f2c230; --vermelho: #c83a2c; --cinza: #9aa5b1; }
.totais { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.total { background: var(--cartao); border: 1px solid var(--borda); border-left: 6px solid var(--primaria); border-radius: var(--raio); padding: 12px 14px; }
.total b { display: block; font-size: 1.7rem; line-height: 1.1; }
.total span { color: var(--suave); font-size: .9rem; }
.total.disponivel { border-left-color: var(--verde); }
.total.em_uso { border-left-color: var(--amarelo); }
.total.manutencao { border-left-color: var(--vermelho); }
.total.vaga { border-left-color: var(--cinza); }

.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.pos { font: inherit; text-align: left; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 120px;
  border: 0; border-radius: var(--raio); padding: 10px 12px 10px 54px; color: #fff; background: var(--verde); transition: transform .08s, box-shadow .08s; }
.pos:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
.pos .num { position: absolute; left: 8px; top: 10px; width: 38px; height: 38px; border-radius: 8px; background: rgba(0,0,0,.22); display: grid; place-items: center; font-weight: 800; font-size: 1.15rem; }
.pos .pref { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
.pos .mod { font-size: .85rem; opacity: .92; }
.pos .estado { margin-top: 4px; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.pos .quem { font-size: .85rem; line-height: 1.3; margin-top: 2px; }
.pos small { opacity: .9; color: inherit; }
.pos .temp { font-style: normal; font-size: .68rem; font-weight: 700; background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 99px; vertical-align: middle; white-space: nowrap; }
.pos.em_uso { background: var(--amarelo); color: #2b2100; }
.pos.manutencao { background: var(--vermelho); }
.pos.vaga { background: transparent; color: var(--suave); border: 2px dashed var(--cinza); }
.pos.vaga .num { background: var(--borda); color: var(--texto); }
.legenda { margin-top: 16px; color: var(--suave); font-size: .85rem; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.bolinha { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: -8px; vertical-align: -1px; }
.bolinha.disponivel { background: var(--verde); } .bolinha.em_uso { background: var(--amarelo); } .bolinha.manutencao { background: var(--vermelho); } .bolinha.vaga { border: 2px dashed var(--cinza); }

.faixa-servico { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: #e6eef8; color: #12304f; border-bottom: 1px solid var(--borda); }
.faixa-servico.sem { background: #fff1cc; color: #5a4300; font-weight: 600; }
.monitor-btn { background: var(--destaque); border-color: var(--destaque); color: #2b2100; font-weight: 600; padding: 5px 10px; }
.cab-vtr { display: flex; gap: 12px; align-items: center; background: var(--fundo); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.num-g { min-width: 46px; height: 46px; border-radius: 8px; background: var(--primaria); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 1.3rem; }
.info { background: var(--fundo); border-radius: 8px; padding: 10px; }
.conferencia { background: var(--fundo); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.conferencia ul { margin: 6px 0 0; padding-left: 18px; }
label.check.destaque { background: var(--alerta-bg); padding: 10px; border-radius: 8px; }
.tres { display: grid; grid-template-columns: 1fr 2fr 1.3fr; gap: 8px; }
.novo-militar { border: 1px solid var(--borda); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
.novo-militar label { margin-bottom: 8px; }
.mais { margin: -8px 0 8px; color: var(--primaria) !important; }
.perigo-txt { color: var(--perigo); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .78rem; font-weight: 600; }
.tag.em_uso { background: #fbefc4; color: #6b5200; }
.tag.manutencao { background: var(--perigo-bg); color: var(--perigo); }
.tag.disponivel { background: var(--ok-bg); color: var(--ok); }
.tag.temp { background: var(--fundo); color: var(--suave); }
.vazio { color: var(--suave); text-align: center; padding: 24px; }

/* tabelas */
.tabela-wrap { overflow-x: auto; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--borda); text-align: left; vertical-align: top; }
th { font-size: .82rem; color: var(--suave); text-transform: uppercase; letter-spacing: .03em; background: var(--fundo); }
tr.inativo td { opacity: .5; }
td.acoes { white-space: nowrap; }

/* modal */
dialog { border: 0; padding: 0; border-radius: 14px; width: min(520px, calc(100vw - 24px)); background: var(--cartao); color: var(--texto); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog.largo { width: min(760px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(10,20,35,.55); }
.modal-corpo { padding: 18px 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
.modal-corpo header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.modal-corpo h2 { margin: 0; font-size: 1.15rem; }
.modal-corpo footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap-reverse; }
select[size] { padding: 4px; }
.lista-check { max-height: 320px; overflow-y: auto; border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
.lista-check label { margin: 4px 0; }
.rotulo { font-weight: 500; margin-bottom: 4px; }

/* assinatura com o dedo */
.assinatura { position: relative; border: 2px dashed var(--borda); border-radius: 10px; background: #fff; height: 180px; }
.assinatura canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; border-radius: 8px; }
.assinatura-dica { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa6b4; pointer-events: none; font-size: 1.05rem; }
.assinatura::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 38px; border-bottom: 1px solid #c9d1db; pointer-events: none; }
.assinatura-limpar { position: absolute; top: 4px; right: 4px; color: #33475e !important; font-size: .85rem; }
.ass-ver { margin: 0 0 16px; }
.ass-ver img { width: 100%; max-height: 220px; object-fit: contain; background: #fff; border: 1px solid var(--borda); border-radius: 8px; margin-top: 6px; }

#aviso { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); background: var(--ok); color: #fff; padding: 10px 18px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; z-index: 100; max-width: calc(100vw - 32px); }
#aviso.mostrar { opacity: 1; transform: translate(-50%, 0); }
#aviso.erro { background: var(--perigo); }

@media (max-width: 700px) {
  .totais { grid-template-columns: repeat(2, 1fr); }
  .duas { grid-template-columns: 1fr; }
  .grade { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .tres { grid-template-columns: 1fr; }
  .usuario #nome-usuario { display: none; }
  .marca { flex: 1; }
  #menu { order: 3; flex-basis: 100%; }
  .filtros input[type=search] { width: 100%; }
  .assinatura { height: 200px; }
}
@media print { .topo, .filtros, button { display: none !important; } }

body.modo-monitor { --verde: #1e9a50; --amarelo: #f5c518; --vermelho: #d63a2b; --fundo: #0c121a; --barra: #141d29; }

body.modo-monitor { height: 100vh; margin: 0; }
body.modo-monitor { background: var(--fundo); color: #e9eef5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }

.m-topo { display: flex; align-items: center; gap: 24px; padding: 10px 18px; background: var(--barra); border-bottom: 1px solid #243246; flex-wrap: wrap; }
.m-titulo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.35rem; letter-spacing: .06em; }
.m-sgt { font-size: .8rem; color: #93a4b8; letter-spacing: .08em; display: flex; flex-direction: column; }
.m-sgt b { color: #fff; font-size: 1.25rem; letter-spacing: 0; }
.m-sgt .alerta { color: var(--amarelo); }
.m-totais { display: flex; gap: 10px; margin-left: auto; }
.m-totais .c { display: flex; flex-direction: column; align-items: center; min-width: 74px; padding: 4px 10px; border-radius: 8px; font-size: 1.6rem; font-weight: 800; line-height: 1.05; }
.m-totais small { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.c.disponivel { background: var(--verde); } .c.em_uso { background: var(--amarelo); color: #2a2000; } .c.manutencao { background: var(--vermelho); } .c.vaga { border: 2px dashed #5d6b7c; color: #a7b3c2; }
.m-relogio { display: flex; flex-direction: column; align-items: flex-end; }
.m-relogio span { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.m-relogio small { color: #93a4b8; text-transform: capitalize; }
#m-tela-cheia { background: none; border: 1px solid #344458; color: #cfd8e3; border-radius: 8px; font-size: 1.2rem; padding: 4px 10px; cursor: pointer; }

.m-grade { flex: 1; display: grid; gap: 8px; padding: 8px; min-height: 0; align-content: start; --t: 120px; }
.m-pos { position: relative; border-radius: 10px; overflow: hidden; display: flex; background: var(--verde); color: #fff; font-size: calc(var(--t) * .12); min-width: 0; }
.m-num { flex: 0 0 auto; width: calc(var(--t) * .36); display: grid; place-items: center; background: rgba(0,0,0,.25); font-weight: 900; font-size: calc(var(--t) * .26); }
.m-corpo { padding: calc(var(--t) * .06) calc(var(--t) * .08); min-width: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 1px; overflow: hidden; }
.m-pref { font-weight: 900; font-size: 1.45em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-placa { font-size: .85em; font-weight: 800; letter-spacing: .08em; }
.m-mod { font-size: .85em; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-mod i { font-style: normal; font-weight: 800; background: rgba(0,0,0,.28); padding: 0 .4em; border-radius: 99px; font-size: .85em; }
.m-est { font-weight: 900; letter-spacing: .06em; font-size: .9em; margin-top: .15em; }
.m-info { display: flex; flex-direction: column; font-size: .82em; line-height: 1.2; margin-top: .1em; }
.m-info span, .m-info b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-pos.em_uso { background: var(--amarelo); color: #231b00; }
.m-pos.em_uso .m-mod { display: none; }
.m-pos.em_uso .m-corpo { font-size: .92em; }
.m-pos.manutencao { background: var(--vermelho); }
.m-pos.vaga { background: transparent; border: 2px dashed #3a4859; color: #6f7f92; }
.m-pos.vaga .m-num { background: #182230; }

.m-status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 8px; display: none; }
.m-status.erro { display: block; background: var(--vermelho); color: #fff; }
.m-status a { color: #fff; font-weight: 700; }


body.modo-monitor #tela-monitor { display: flex; flex-direction: column; height: 100vh; }
body.modo-monitor #tela-monitor[hidden] { display: none !important; }
body.modo-monitor main.m-grade { max-width: none; margin: 0; width: 100%; }
.m-totais small { color: inherit; }
.marca svg, .m-titulo svg { width: 28px; height: 28px; flex: 0 0 auto; }
.m-titulo svg { width: 34px; height: 34px; }
.bloco { margin-bottom: 16px; }
.bloco h2 { margin: 0 0 8px; font-size: 1.1rem; }
.acoes-linha { display: flex; gap: 8px; flex-wrap: wrap; }
.ok-txt { color: var(--ok); } .alerta-txt { color: var(--perigo); font-weight: 600; }
.btn.perigo { background: var(--perigo); border-color: var(--perigo); color: #fff; }

  </style>
</head>
<body>
  <!-- Controle do Sgt de Dia -->
  <div id="tela-app" hidden>
    <header class="topo">
      <div class="marca"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1f3a5f"/><circle cx="24" cy="26" r="11" fill="none" stroke="#f2c14e" stroke-width="5"/><path d="M32 33l18 18m-6-6l5-5m-10 0l4-4" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/></svg> Claviculário</div>
      <nav id="menu">
        <a href="#painel">Controle</a>
        <a href="#historico">Cautelas</a>

      </nav>
      <div class="usuario">

  <!-- Monitor (segunda tela) -->
  <div id="tela-monitor" hidden>
    <header class="m-topo">
      <div class="m-titulo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1f3a5f"/><circle cx="24" cy="26" r="11" fill="none" stroke="#f2c14e" stroke-width="5"/><path d="M32 33l18 18m-6-6l5-5m-10 0l4-4" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/></svg> CLAVICULÁRIO</div>
      <div class="m-sgt" id="m-sgt"></div>
      <div class="m-totais" id="m-totais"></div>
      <div class="m-relogio"><span id="m-hora"></span><small id="m-data"></small></div>

    <form method="dialog" class="modal-corpo" id="modal-form">

  <div id="aviso" role="status" aria-live="polite"></div>

  <script>
'use strict';
/*
 * "Servidor" que roda dentro do navegador: guarda tudo no IndexedDB e
 * responde às mesmas rotas /api/... da versão com Node.js, com as mesmas regras.
 */
const BancoLocal = (() => {
  const NOME = 'claviculario-digital';
  let conexao;
  function abrir() {
    if (conexao) return conexao;
    conexao = new Promise((ok, erro) => {
      const r = indexedDB.open(NOME, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('assinaturas'); };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => erro(r.error);
    });
    return conexao;
  }
  async function op(loja, modo, fn) {
    const db = await abrir();
    return new Promise((ok, erro) => {
      const tx = db.transaction(loja, modo);
      const req = fn(tx.objectStore(loja));
      tx.oncomplete = () => ok(req?.result);
      tx.onerror = () => erro(tx.error);
      tx.onabort = () => erro(tx.error || new Error('Não foi possível gravar os dados'));
    });
  }
  return {
    ler: (k) => op('kv', 'readonly', (s) => s.get(k)),
    gravar: (k, v) => op('kv', 'readwrite', (s) => s.put(v, k)),
    lerAssinatura: (id) => op('assinaturas', 'readonly', (s) => s.get(id)),
    gravarAssinatura: (id, v) => op('assinaturas', 'readwrite', (s) => s.put(v, id)),
    todasAssinaturas: async () => {
      const db = await abrir();
      return new Promise((ok, erro) => {
        const out = {}, tx = db.transaction('assinaturas', 'readonly');
        tx.objectStore('assinaturas').openCursor().onsuccess = (e) => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } };
        tx.oncomplete = () => ok(out); tx.onerror = () => erro(tx.error);
      });
    },
    limparTudo: async () => { await op('kv', 'readwrite', (s) => s.clear()); await op('assinaturas', 'readwrite', (s) => s.clear()); },
  };
})();

const Local = (() => {
  const EXIGIR_ASSINATURA = true;
  let E = null; // estado em memória

  const novoEstado = () => ({
    versao: 1, criado_em: new Date().toISOString(), total_posicoes: 30,
    seq: {}, pessoas: [], viaturas: [], servicos: [], cautelas: [], temporarias: [], auditoria: [],
  });

  class ErroRegra extends Error {}
  const falha = (msg) => { throw new ErroRegra(msg); };
  const agora = () => new Date().toISOString();
  const texto = (v) => (v === undefined || v === null ? '' : String(v).trim());
  const nulo = (v) => texto(v) || null;
  const bool = (v) => v === true || v === 1 || v === '1' || v === 'true' || v === 'on';
  const placaNorm = (v) => texto(v).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const novoId = (tipo) => (E.seq[tipo] = (E.seq[tipo] || 0) + 1);
  const nomeMil = (p) => (p ? [p.posto, p.nome].filter(Boolean).join(' ') : '');
  function inteiro(v, campo) {
    if (!texto(v)) return null;
    const n = Number(v);
    if (!Number.isInteger(n) || n < 0) falha(`${campo} inválido`);
    return n;
  }
  function exigir(obj, campos) { for (const [c, nome] of Object.entries(campos)) if (!texto(obj[c])) falha(`Informe: ${nome}`); }
  function validarAssinatura(v, obrigatoria = EXIGIR_ASSINATURA) {
    if (!v) { if (obrigatoria) falha('A assinatura é obrigatória'); return null; }
    if (typeof v !== 'string' || !v.startsWith('data:image/')) falha('Assinatura inválida');
    return v;
  }

  // ---------- consultas ----------
  const pessoa = (id) => E.pessoas.find((p) => p.id === Number(id));
  const viatura = (id) => E.viaturas.find((v) => v.id === Number(id)) || falha('Viatura não encontrada');
  const servicoAtual = () => {
    const s = E.servicos.find((x) => !x.fim);
    if (!s) return null;
    const sg = pessoa(s.sargento_id);
    return { ...s, sargento_nome: sg?.nome, sargento_posto: sg?.posto };
  };
  const exigirServico = () => servicoAtual() || falha('Nenhum Sgt de Dia de serviço. Assuma o serviço antes de registrar movimentações.');
  const cautelaAberta = (vid) => E.cautelas.find((c) => c.viatura_id === vid && !c.retorno_em);
  const pessoaAtiva = (id, papel) => { const p = pessoa(id); if (!p || !p.ativo) falha(`${papel} não encontrado ou inativo`); return p; };
  function posicaoLivre(numero, ignorar = 0) {
    const n = Number(numero);
    if (!Number.isInteger(n) || n < 1 || n > E.total_posicoes) falha(`Posição ${numero} não existe no claviculário`);
    const ocup = E.viaturas.find((v) => v.posicao === n && v.id !== ignorar);
    if (ocup) falha(`Posição ${n} já está ocupada (${ocup.prefixo || ocup.placa})`);
    return n;
  }
  function auditar(acao, detalhe) {
    const s = servicoAtual();
    E.auditoria.unshift({ id: novoId('auditoria'), acao, detalhe: detalhe ? JSON.stringify(detalhe) : null, em: agora(), servico_id: s?.id ?? null });
    if (E.auditoria.length > 3000) E.auditoria.length = 3000;
  }

  function painel() {
    const posicoes = [];
    for (let n = 1; n <= E.total_posicoes; n++) {
      const v = E.viaturas.find((x) => x.posicao === n);
      const c = v && cautelaAberta(v.id);
      const m = c && pessoa(c.motorista_saida_id);
      posicoes.push({
        numero: n,
        viatura_id: v?.id ?? null, prefixo: v?.prefixo, modelo: v?.modelo, placa: v?.placa, setor_origem: v?.setor_origem, tipo: v?.tipo,
        manutencao: v?.manutencao ? 1 : 0, manutencao_motivo: v?.manutencao_motivo, manutencao_desde: v?.manutencao_desde,
        cautela_id: c?.id ?? null, missao: c?.missao, destino: c?.destino, saida_em: c?.saida_em, km_saida: c?.km_saida ?? null,
        motorista_id: m?.id, motorista_nome: m?.nome, motorista_posto: m?.posto, motorista_telefone: m?.telefone,
        status: !v ? 'vaga' : c ? 'em_uso' : v.manutencao ? 'manutencao' : 'disponivel',
      });
    }
    const conta = (s) => posicoes.filter((p) => p.status === s).length;
    return {
      gerado_em: agora(), servico: servicoAtual(),
      totais: { posicoes: posicoes.length, disponiveis: conta('disponivel'), em_uso: conta('em_uso'), manutencao: conta('manutencao'), vagas: conta('vaga') },
      posicoes,
    };
  }

  function linhaCautela(c) {
    const ms = pessoa(c.motorista_saida_id), mr = pessoa(c.motorista_retorno_id);
    const ss = E.servicos.find((s) => s.id === c.servico_saida_id), sr = E.servicos.find((s) => s.id === c.servico_retorno_id);
    return {
      id: c.id, posicao: c.posicao, vtr_prefixo: c.vtr_prefixo, vtr_modelo: c.vtr_modelo, vtr_placa: c.vtr_placa, missao: c.missao, destino: c.destino,
      saida_em: c.saida_em, km_saida: c.km_saida, retorno_em: c.retorno_em, km_retorno: c.km_retorno, encerramento: c.encerramento,
      obs_saida: c.obs_saida, obs_retorno: c.obs_retorno,
      motorista_saida: ms?.nome, motorista_saida_posto: ms?.posto, motorista_saida_ident: ms?.identificacao,
      motorista_retorno: mr?.nome, motorista_retorno_posto: mr?.posto,
      sgt_saida: nomeMil(ss && pessoa(ss.sargento_id)), sgt_retorno: nomeMil(sr && pessoa(sr.sargento_id)) || null,
      assinada_saida: c.ass_saida ? 1 : 0, assinada_retorno: c.ass_retorno ? 1 : 0,
    };
  }
  function listarCautelas(prm) {
    const dia = (d, fim) => new Date(`${d}T${fim ? '23:59:59.999' : '00:00:00'}`).toISOString();
    const de = prm.get('de') && dia(prm.get('de')), ate = prm.get('ate') && dia(prm.get('ate'), true);
    const vid = Number(prm.get('viatura_id')) || 0, sid = Number(prm.get('servico_id')) || 0;
    return E.cautelas.filter((c) => (!de || c.saida_em >= de) && (!ate || c.saida_em <= ate) && (!vid || c.viatura_id === vid)
      && (!sid || c.servico_saida_id === sid || c.servico_retorno_id === sid) && (prm.get('abertas') !== '1' || !c.retorno_em))
      .sort((a, b) => (a.saida_em < b.saida_em ? 1 : -1)).slice(0, 5000).map(linhaCautela);
  }

  // ---------- rotas ----------
  const rotas = [];
  const rota = (metodo, padrao, fn) => {
    const re = new RegExp('^' + padrao.replace(/:id/g, '(\\d+)') + '$');
    rotas.push({ metodo, re, fn });
  };
  const assinaturasPendentes = [];
  const guardarAssinatura = (v) => { if (!v) return null; const id = `a${novoId('assinatura')}`; assinaturasPendentes.push([id, v]); return id; };

  rota('GET', '/api/painel', () => painel());
  rota('GET', '/api/servico/atual', () => {
    const s = servicoAtual();
    return s ? { servico: s, cautelas_abertas: listarCautelas(new URLSearchParams('abertas=1')) } : { servico: null };
  });
  rota('POST', '/api/servico/assumir', (b) => {
    const sgt = pessoaAtiva(b.sargento_id, 'Sargento');
    const ant = E.servicos.find((s) => !s.fim);
    const t = agora();
    if (ant) { ant.fim = t; ant.obs_passagem = nulo(b.obs_passagem); }
    const s = { id: novoId('servico'), sargento_id: sgt.id, inicio: t, fim: null, obs_assuncao: nulo(b.obs_assuncao), obs_passagem: null };
    E.servicos.push(s);
    auditar('servico_assumido', { sargento: nomeMil(sgt), anterior: ant?.id ?? null });
    return { id: s.id, anterior_id: ant?.id ?? null };
  });
  rota('GET', '/api/servicos', () => [...E.servicos].sort((a, b) => (a.inicio < b.inicio ? 1 : -1)).map((s) => ({
    ...s, sargento: nomeMil(pessoa(s.sargento_id)),
    saidas: E.cautelas.filter((c) => c.servico_saida_id === s.id).length, retornos: E.cautelas.filter((c) => c.servico_retorno_id === s.id).length,
  })));

  // Militares
  const ordenaNome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
  rota('GET', '/api/pessoas', (b, prm) => E.pessoas.filter((p) => prm.get('todas') === '1' || p.ativo).sort(ordenaNome));
  rota('POST', '/api/pessoas', (b) => {
    exigir(b, { nome: 'o nome', identificacao: 'o SARAM/identificação' });
    if (E.pessoas.some((p) => p.identificacao === texto(b.identificacao))) falha('Já existe militar com essa identificação');
    const p = { id: novoId('pessoa'), nome: texto(b.nome), posto: nulo(b.posto), identificacao: texto(b.identificacao), setor: nulo(b.setor), telefone: nulo(b.telefone), ativo: 1 };
    E.pessoas.push(p); auditar('pessoa_criada', { nome: p.nome });
    return p;
  });
  rota('PUT', '/api/pessoas/:id', (b, prm, id) => {
    const p = pessoa(id) || falha('Militar não encontrado');
    exigir(b, { nome: 'o nome', identificacao: 'o SARAM/identificação' });
    if (E.pessoas.some((x) => x.identificacao === texto(b.identificacao) && x.id !== p.id)) falha('Já existe militar com essa identificação');
    Object.assign(p, { nome: texto(b.nome), posto: nulo(b.posto), identificacao: texto(b.identificacao), setor: nulo(b.setor), telefone: nulo(b.telefone), ativo: b.ativo === undefined ? p.ativo : (bool(b.ativo) ? 1 : 0) });
    auditar('pessoa_editada', { id: p.id });
    return p;
  });

  // Posições e viaturas
  rota('PUT', '/api/posicoes', (b) => {
    const total = Number(b.total);
    if (!Number.isInteger(total) || total < 1 || total > 500) falha('Quantidade de posições inválida (1 a 500)');
    const maior = Math.max(0, ...E.viaturas.map((v) => v.posicao || 0));
    if (total < maior) falha(`A posição ${maior} está ocupada; não é possível reduzir para ${total}`);
    E.total_posicoes = total; auditar('posicoes_alteradas', { total });
    return { total };
  });
  rota('GET', '/api/viaturas', (b, prm) => E.viaturas.filter((v) => prm.get('todas') === '1' || (v.ativa && v.no_claviculario))
    .sort((a, b2) => (a.tipo === b2.tipo ? (a.posicao ?? 999) - (b2.posicao ?? 999) : a.tipo === 'fixa' ? -1 : 1)));
  rota('POST', '/api/viaturas', (b) => {
    exigir(b, { modelo: 'o modelo', placa: 'a placa', posicao: 'a posição no claviculário' });
    const placa = placaNorm(b.placa);
    if (E.viaturas.some((v) => v.placa === placa)) falha('Já existe viatura com essa placa');
    const v = { id: novoId('viatura'), prefixo: nulo(b.prefixo), modelo: texto(b.modelo), placa, setor_origem: texto(b.setor_origem) || 'STS', tipo: 'fixa',
      posicao: posicaoLivre(b.posicao), no_claviculario: 1, manutencao: 0, manutencao_motivo: null, manutencao_desde: null, ativa: 1 };
    E.viaturas.push(v); auditar('viatura_fixa_criada', { placa, posicao: v.posicao });
    return v;
  });
  rota('PUT', '/api/viaturas/:id', (b, prm, id) => {
    const v = viatura(id);
    exigir(b, { modelo: 'o modelo', placa: 'a placa' });
    const placa = placaNorm(b.placa);
    if (E.viaturas.some((x) => x.placa === placa && x.id !== v.id)) falha('Já existe viatura com essa placa');
    const ativa = b.ativa === undefined ? v.ativa : (bool(b.ativa) ? 1 : 0);
    let pos = v.posicao;
    if (v.tipo === 'fixa') {
      if (!ativa) { if (cautelaAberta(v.id)) falha('A chave desta viatura está cautelada'); pos = null; }
      else { if (!texto(b.posicao)) falha('Informe a posição no claviculário'); pos = posicaoLivre(b.posicao, v.id); }
    }
    Object.assign(v, { prefixo: nulo(b.prefixo), modelo: texto(b.modelo), placa, setor_origem: texto(b.setor_origem) || v.setor_origem, posicao: pos, ativa });
    auditar('viatura_editada', { id: v.id, placa });
    return v;
  });
  rota('POST', '/api/viaturas/:id/manutencao', (b, prm, id) => {
    exigirServico();
    const v = viatura(id), em = bool(b.em_manutencao);
    if (em) {
      if (cautelaAberta(v.id)) falha('Registre a devolução da chave antes de colocar a viatura em manutenção');
      exigir(b, { motivo: 'o motivo da manutenção' });
      Object.assign(v, { manutencao: 1, manutencao_motivo: texto(b.motivo), manutencao_desde: agora() });
    } else Object.assign(v, { manutencao: 0, manutencao_motivo: null, manutencao_desde: null });
    auditar(em ? 'manutencao_inicio' : 'manutencao_fim', { viatura: v.prefixo || v.placa, motivo: nulo(b.motivo) });
    return v;
  });

  // Temporárias
  rota('POST', '/api/temporarias/entrada', (b) => {
    const s = exigirServico();
    exigir(b, { modelo: 'o modelo', placa: 'a placa', setor_origem: 'o setor de origem', posicao: 'a posição', entregue_por: 'quem entregou a chave' });
    const placa = placaNorm(b.placa);
    let v = E.viaturas.find((x) => x.placa === placa);
    if (v && v.no_claviculario && v.ativa) falha(`Viatura ${placa} já está no claviculário (posição ${v.posicao})`);
    if (v && v.tipo === 'fixa') falha(`A placa ${placa} é de uma viatura fixa desativada; reative-a no cadastro`);
    const pos = posicaoLivre(b.posicao);
    const ass = validarAssinatura(b.assinatura, false);
    if (v) Object.assign(v, { prefixo: nulo(b.prefixo), modelo: texto(b.modelo), setor_origem: texto(b.setor_origem), posicao: pos, no_claviculario: 1, ativa: 1, manutencao: 0, manutencao_motivo: null, manutencao_desde: null });
    else E.viaturas.push(v = { id: novoId('viatura'), prefixo: nulo(b.prefixo), modelo: texto(b.modelo), placa, setor_origem: texto(b.setor_origem), tipo: 'temporaria', posicao: pos, no_claviculario: 1, manutencao: 0, manutencao_motivo: null, manutencao_desde: null, ativa: 1 });
    E.temporarias.push({ id: novoId('temporaria'), viatura_id: v.id, tipo: 'entrada', posicao: pos, pessoa_nome: texto(b.entregue_por), ass: guardarAssinatura(ass), obs: nulo(b.obs), em: agora(), servico_id: s.id });
    auditar('temporaria_entrada', { placa, setor: texto(b.setor_origem), posicao: pos });
    return v;
  });
  rota('POST', '/api/temporarias/:id/saida', (b, prm, id) => {
    const s = exigirServico(), v = viatura(id);
    if (v.tipo !== 'temporaria' || !v.no_claviculario) falha('Esta viatura não é uma temporária no claviculário');
    if (cautelaAberta(v.id)) falha('A chave está cautelada; registre o retorno (ou "não retornou") primeiro');
    exigir(b, { recebido_por: 'quem recebeu a chave' });
    const ass = validarAssinatura(b.assinatura);
    E.temporarias.push({ id: novoId('temporaria'), viatura_id: v.id, tipo: 'saida', posicao: v.posicao, pessoa_nome: texto(b.recebido_por), ass: guardarAssinatura(ass), obs: nulo(b.obs), em: agora(), servico_id: s.id });
    auditar('temporaria_saida', { viatura: v.prefixo || v.placa, posicao: v.posicao });
    Object.assign(v, { posicao: null, no_claviculario: 0, manutencao: 0 });
    return { ok: true };
  });
  rota('GET', '/api/temporarias/registros', () => [...E.temporarias].sort((a, b) => (a.em < b.em ? 1 : -1)).slice(0, 500).map((r) => {
    const v = viatura(r.viatura_id), s = E.servicos.find((x) => x.id === r.servico_id);
    return { id: r.id, tipo: r.tipo, posicao: r.posicao, pessoa_nome: r.pessoa_nome, obs: r.obs, em: r.em, assinado: r.ass ? 1 : 0,
      prefixo: v.prefixo, modelo: v.modelo, placa: v.placa, setor_origem: v.setor_origem, sargento: nomeMil(s && pessoa(s.sargento_id)) };
  }));
  rota('GET', '/api/temporarias/registros/:id', async (b, prm, id) => {
    const r = E.temporarias.find((x) => x.id === id) || falha('Registro não encontrado');
    return { ...r, assinatura: r.ass ? await BancoLocal.lerAssinatura(r.ass) : null };
  });

  // Cautelas
  rota('POST', '/api/cautelas/saida', (b) => {
    const s = exigirServico(), v = viatura(b.viatura_id);
    if (!v.ativa || !v.no_claviculario || !v.posicao) falha('Esta viatura não está no claviculário');
    if (v.manutencao) falha(`Viatura ${v.prefixo || v.placa} está em manutenção`);
    if (cautelaAberta(v.id)) falha(`A chave da viatura ${v.prefixo || v.placa} já está cautelada`);
    const mot = pessoaAtiva(b.motorista_id, 'Motorista');
    exigir(b, { missao: 'a missão' });
    const ass = validarAssinatura(b.assinatura), km = inteiro(b.km_saida, 'Odômetro de saída');
    const c = { id: novoId('cautela'), viatura_id: v.id, posicao: v.posicao, vtr_prefixo: v.prefixo, vtr_modelo: v.modelo, vtr_placa: v.placa,
      missao: texto(b.missao), destino: nulo(b.destino), saida_em: agora(), km_saida: km, motorista_saida_id: mot.id, ass_saida: guardarAssinatura(ass),
      obs_saida: nulo(b.obs), servico_saida_id: s.id, retorno_em: null, encerramento: null, km_retorno: null, motorista_retorno_id: null,
      ass_retorno: null, obs_retorno: null, servico_retorno_id: null };
    E.cautelas.push(c);
    auditar('saida_viatura', { viatura: v.prefixo || v.placa, motorista: mot.nome, missao: c.missao });
    return { id: c.id };
  });
  rota('POST', '/api/cautelas/retorno', (b) => {
    const s = exigirServico(), v = viatura(b.viatura_id), c = cautelaAberta(v.id);
    if (!c) falha(`A chave da viatura ${v.prefixo || v.placa} não está cautelada`);
    if (bool(b.nao_retornou)) {
      if (v.tipo !== 'temporaria') falha('Só viaturas temporárias podem ser encerradas sem retorno à STS');
      const t = agora();
      Object.assign(c, { retorno_em: t, encerramento: 'nao_retornou', obs_retorno: nulo(b.obs) || 'Viatura seguiu direto para o setor de origem', servico_retorno_id: s.id });
      E.temporarias.push({ id: novoId('temporaria'), viatura_id: v.id, tipo: 'nao_retornou', posicao: v.posicao, pessoa_nome: nulo(b.informado_por), ass: null, obs: nulo(b.obs), em: t, servico_id: s.id });
      auditar('temporaria_nao_retornou', { viatura: v.prefixo || v.placa, posicao: v.posicao });
      Object.assign(v, { posicao: null, no_claviculario: 0 });
      return { id: c.id, encerramento: c.encerramento };
    }
    const mot = pessoaAtiva(b.motorista_id || c.motorista_saida_id, 'Motorista');
    const ass = validarAssinatura(b.assinatura), km = inteiro(b.km_retorno, 'Odômetro de retorno');
    if (km !== null && c.km_saida !== null && km < c.km_saida) falha(`Odômetro de retorno (${km}) menor que o de saída (${c.km_saida})`);
    Object.assign(c, { retorno_em: agora(), encerramento: 'devolvida', km_retorno: km, motorista_retorno_id: mot.id, ass_retorno: guardarAssinatura(ass), obs_retorno: nulo(b.obs), servico_retorno_id: s.id });
    auditar('retorno_viatura', { viatura: v.prefixo || v.placa, motorista: mot.nome });
    return { id: c.id, encerramento: c.encerramento };
  });
  rota('GET', '/api/cautelas', (b, prm) => listarCautelas(prm));
  rota('GET', '/api/cautelas/:id', async (b, prm, id) => {
    const c = E.cautelas.find((x) => x.id === id) || falha('Cautela não encontrada');
    return { ...c, motorista_saida: nomeMil(pessoa(c.motorista_saida_id)), motorista_retorno: nomeMil(pessoa(c.motorista_retorno_id)),
      assinatura_saida: c.ass_saida ? await BancoLocal.lerAssinatura(c.ass_saida) : null,
      assinatura_retorno: c.ass_retorno ? await BancoLocal.lerAssinatura(c.ass_retorno) : null };
  });
  rota('GET', '/api/auditoria', () => E.auditoria.slice(0, 500).map((a) => {
    const s = E.servicos.find((x) => x.id === a.servico_id);
    return { ...a, sargento: nomeMil(s && pessoa(s.sargento_id)) };
  }));

  // ---------- execução ----------
  let fila = Promise.resolve();
  async function carregar() { E = (await BancoLocal.ler('estado')) || novoEstado(); return E; }

  // Executa uma rota. Escritas são feitas em fila; se der erro, nada é gravado.
  function chamar(metodo, url, corpo) {
    const tarefa = fila.then(async () => {

function criarQuadroAssinatura(container) {
  container.classList.add('assinatura');

    <canvas aria-label="Assine aqui com o dedo"></canvas>
    <span class="assinatura-dica">Assine aqui com o dedo</span>

  const dica = container.querySelector('.assinatura-dica');
  const ctx = canvas.getContext('2d');
  let desenhando = false, tracos = 0, ultimo = null;

  function ajustar() {
    const r = canvas.getBoundingClientRect();
    if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    const copia = tracos ? canvas.toDataURL() : null;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1f3a';
    if (copia) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = copia; }

    for (const ev of eventos) {
      const atual = pos(ev);
      ctx.lineWidth = 1.5 + atual.p * 2;
      ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(atual.x, atual.y); ctx.stroke();
      ultimo = atual;
    }
  });
  const parar = () => { desenhando = false; };
  canvas.addEventListener('pointerup', parar);
  canvas.addEventListener('pointercancel', parar);

  const api = {
    vazio: () => tracos === 0,
    limpar() { ctx.clearRect(0, 0, canvas.width, canvas.height); tracos = 0; dica.hidden = false; },
    png() {
      // exporta com fundo branco para ficar legível em qualquer visualizador
      const out = document.createElement('canvas');
      out.width = canvas.width; out.height = canvas.height;
      const o = out.getContext('2d');
      o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(canvas, 0, 0);

      if (quadro.vazio()) throw new Error('O motorista precisa assinar');

      aviso(`Chave da ${p.prefixo || p.placa} devolvida`); await depois();

  });
}

// ---------- exportação CSV (Excel) ----------
function baixarArquivo(nome, conteudo, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = Object.assign(document.createElement('a'), { href: url, download: nome });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function baixarCsv(linhas) {
  const escCsv = (v) => { const s = v === null || v === undefined ? '' : String(v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const dt = (iso) => (iso ? new Date(iso).toLocaleString('pt-BR') : '');
  const cols = [['Nº', (l) => l.id], ['Posição', (l) => l.posicao], ['Prefixo', (l) => l.vtr_prefixo], ['Modelo', (l) => l.vtr_modelo], ['Placa', (l) => l.vtr_placa],
    ['Missão', (l) => l.missao], ['Destino', (l) => l.destino], ['Motorista (saída)', (l) => nomeMil(l.motorista_saida_posto, l.motorista_saida)],
    ['SARAM', (l) => l.motorista_saida_ident], ['Saída', (l) => dt(l.saida_em)], ['Km saída', (l) => l.km_saida], ['Sgt de Dia (saída)', (l) => l.sgt_saida],
    ['Situação', (l) => (!l.retorno_em ? 'Em uso' : l.encerramento === 'nao_retornou' ? 'Não retornou à STS' : 'Devolvida')],
    ['Motorista (devolução)', (l) => nomeMil(l.motorista_retorno_posto, l.motorista_retorno)], ['Devolução', (l) => dt(l.retorno_em)],
    ['Km retorno', (l) => l.km_retorno], ['Km rodados', (l) => (l.km_retorno != null && l.km_saida != null ? l.km_retorno - l.km_saida : '')],
    ['Sgt de Dia (devolução)', (l) => l.sgt_retorno], ['Obs. saída', (l) => l.obs_saida], ['Obs. devolução', (l) => l.obs_retorno]];
  const txt = '﻿' + [cols.map((c) => escCsv(c[0])).join(';'), ...linhas.map((l) => cols.map((c) => escCsv(c[1](l))).join(';'))].join('\r\n');
  baixarArquivo(`cautelas-${new Date().toISOString().slice(0, 10)}.csv`, txt, 'text/csv;charset=utf-8');
}

  try { persistente = await navigator.storage?.persisted?.(); } catch { /* */ }
  el.innerHTML = `
    <div class="cabecalho"><h1>Backup e configurações</h1></div>
    <div class="cartao bloco">
      <h2>💾 Backup dos dados</h2>
      <p>Os dados ficam guardados <b>dentro deste navegador, neste computador</b>. Se alguém limpar o histórico ou os dados do navegador, eles se perdem.
        Por isso, <b>salve um backup pelo menos uma vez por semana</b> (ex.: na passagem de serviço de segunda-feira) e guarde o arquivo num pendrive ou na rede.</p>
      <p class="${ult && Date.now() - new Date(ult) < 7 * 864e5 ? 'ok-txt' : 'alerta-txt'}">Último backup: <b>${ult ? dataHora(ult) : 'nunca feito'}</b></p>
      <div class="acoes-linha">
        <button class="btn primario" id="b-backup">Salvar backup agora</button>
        <label class="btn" for="f-restaurar">Restaurar um backup…</label><input type="file" id="f-restaurar" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="cartao bloco">
      <h2>📊 Situação</h2>
      <p>${E.viaturas.filter((v) => v.ativa && v.tipo === 'fixa').length} viaturas fixas · ${E.pessoas.length} militares · ${E.cautelas.length} cautelas · ${E.servicos.length} serviços registrados</p>
      <p class="sub">Armazenamento protegido contra limpeza automática do navegador: <b>${persistente ? 'sim' : 'não'}</b>${persistente ? '' : ' <button class="btn pequeno" id="b-persist">Proteger</button>'}</p>
    </div>
    <div class="cartao bloco">
      <h2>🧪 Teste</h2>
      <p>Carrega 12 viaturas, militares, cautelas e uma viatura do Rancho para testar o sistema. Só funciona com o sistema vazio.</p>
      <div class="acoes-linha">
        <button class="btn" id="b-exemplo" ${E.viaturas.length ? 'disabled' : ''}>Carregar dados de exemplo</button>
        <button class="btn perigo-txt" id="b-apagar">Apagar TODOS os dados</button>
      </div>
    </div>`;
  $('#b-backup').onclick = () => fazerBackup().then(() => telaBackup(el)).catch((e) => aviso(e.message, 'erro'));
  $('#b-persist') && ($('#b-persist').onclick = async () => { await navigator.storage.persist?.(); telaBackup(el); });
  $('#f-restaurar').onchange = async (e) => {
    const arq = e.target.files[0]; if (!arq) return;
    try {
      const dados = JSON.parse(await arq.text());
      modal({
        titulo: 'Restaurar backup',
        html: `<p>Isto vai <b>substituir todos os dados atuais</b> pelos do arquivo <b>${esc(arq.name)}</b> (gerado em ${dataHora(dados.gerado_em)}).</p>`,
        acoes: [{ texto: 'Substituir e restaurar', classe: 'primario', acao: async () => { await Local.importar(dados); aviso('Backup restaurado'); await atualizarServico(); telaBackup(el); } }],
      });
    } catch (er) { aviso(er.message.includes('JSON') ? 'Arquivo inválido' : er.message, 'erro'); }
    e.target.value = '';
  };
  $('#b-exemplo').onclick = async () => { await carregarExemplo(); aviso('Dados de exemplo carregados'); location.hash = '#painel'; };
  $('#b-apagar').onclick = () => modal({
    titulo: 'Apagar todos os dados',
    html: '<p>Isto apaga <b>viaturas, militares, cautelas, assinaturas e serviços</b> deste computador. Faça um backup antes.</p><label>Para confirmar, digite <b>APAGAR</b> <input name="conf" autocomplete="off"></label>',
    acoes: [{ texto: 'Apagar tudo', classe: 'primario perigo', acao: async () => {
      if (valorForm($('#modal-conteudo')).conf.trim().toUpperCase() !== 'APAGAR') throw new Error('Digite APAGAR para confirmar');
      await Local.apagarTudo(); aviso('Dados apagados'); await atualizarServico(); telaBackup(el);
    } }],
  });
}

// ---------- dados de exemplo ----------
async function carregarExemplo() {
  const post = (u, d) => api('POST', u, d);
  const vtrs = [['VTR-01', 'Toyota Hilux', 'QWE1A23'], ['VTR-02', 'Toyota Hilux', 'QWE1A24'], ['VTR-03', 'Mitsubishi L200', 'RTY2B11'],
    ['VTR-04', 'Renault Master', 'UIO3C45'], ['VTR-05', 'Fiat Ducato', 'PAS4D67'], ['VTR-06', 'VW Gol', 'DFG5E89'],
    ['VTR-07', 'Chevrolet S10', 'HJK6F01'], ['VTR-08', 'Marcopolo Volare', 'LZX7G23'], ['VTR-09', 'Fiat Strada', 'CVB8H45'],
    ['VTR-10', 'Iveco Daily', 'NMQ9I67'], ['VTR-11', 'Ford Ranger', 'WER0J89'], ['VTR-12', 'Toyota Corolla', 'TYU1K01']];
  const v = {};
  for (const [i, [prefixo, modelo, placa]] of vtrs.entries()) v[prefixo] = (await post('/api/viaturas', { prefixo, modelo, placa, posicao: i + 1 })).id;
  const p = {};
  for (const [posto, nome, identificacao, setor, telefone] of [['2S', 'Silva', '1001', 'STS', '(35) 99999-1001'], ['1S', 'Costa', '1002', 'STS'],
    ['3S', 'Alves', '1003', 'STS'], ['CB', 'Souza', '2001', 'STS', '(35) 99999-2001'], ['S1', 'Lima', '2002', 'STS'], ['S2', 'Ramos', '2003', 'STS'], ['CB', 'Rocha', '3001', 'Rancho']])
    p[nome] = (await post('/api/pessoas', { posto, nome, identificacao, setor, telefone })).id;
  // assinatura de exemplo (rabisco)
  const c = document.createElement('canvas'); c.width = 400; c.height = 120;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 400, 120); x.strokeStyle = '#0b1f3a'; x.lineWidth = 3; x.beginPath();
  for (let i = 0; i <= 60; i++) x.lineTo(30 + i * 5.5, 60 + Math.sin(i / 3) * 25 * Math.cos(i / 11)); x.stroke();
  const ass = c.toDataURL('image/png');
  await post('/api/servico/assumir', { sargento_id: p.Costa });
  await post('/api/cautelas/saida', { viatura_id: v['VTR-06'], motorista_id: p.Lima, missao: 'Correio no centro', km_saida: 30500, assinatura: ass });
  await post('/api/cautelas/retorno', { viatura_id: v['VTR-06'], motorista_id: p.Lima, km_retorno: 30542, assinatura: ass });
  await post('/api/cautelas/saida', { viatura_id: v['VTR-03'], motorista_id: p.Souza, missao: 'Transporte de material ao Hangar 2', assinatura: ass });
  await post('/api/servico/assumir', { sargento_id: p.Silva, obs_passagem: 'VTR-03 em missão' });
  await post('/api/cautelas/saida', { viatura_id: v['VTR-08'], motorista_id: p.Ramos, missao: 'Transporte de cadetes', assinatura: ass });
  await post(`/api/viaturas/${v['VTR-05']}/manutencao`, { em_manutencao: true, motivo: 'Revisão 50.000 km' });
  await post('/api/temporarias/entrada', { prefixo: 'RAN-03', modelo: 'Fiat Fiorino', placa: 'RAN3A33', setor_origem: 'Rancho', posicao: 20, entregue_por: 'CB Rocha' });
}

// ---------- monitor (segunda tela) ----------
function iniciarMonitor() {
  document.body.classList.add('modo-monitor');
  document.title = 'Monitor do Claviculário';
  $('#tela-monitor').hidden = false;
  const STATUS = { disponivel: 'DISPONÍVEL', em_uso: 'EM USO', manutencao: 'MANUTENÇÃO', vaga: 'VAGO' };
  let dados = null, assinaturaDados = '';
  const relogio = () => {
    const d = new Date();
    $('#m-hora').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    $('#m-data').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  };
  function ajustarGrade() {
    const g = $('#m-grade'), n = g.children.length || 1, W = g.clientWidth, H = g.clientHeight, gap = 8;
    let melhor = { cols: 1, area: 0, h: 100 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), w = (W - gap * (cols - 1)) / cols, h = (H - gap * (rows - 1)) / rows;
      const hh = Math.min(h, w / 1.15), ww = Math.min(w, hh * 2.2);
      if (ww * hh > melhor.area) melhor = { cols, area: ww * hh, h };
    }
    g.style.gridTemplateColumns = `repeat(${melhor.cols}, 1fr)`;
    g.style.gridAutoRows = `${Math.max(60, melhor.h)}px`;
    g.style.setProperty('--t', `${Math.max(60, melhor.h)}px`);
  }
  function render() {
    if (!dados) return;
    const s = dados.servico, t = dados.totais;
    $('#m-sgt').innerHTML = s ? `SGT DE DIA<b>${esc(nomeMil(s.sargento_posto, s.sargento_nome))}</b>` : '<b class="alerta">SEM SGT DE DIA DE SERVIÇO</b>';
    $('#m-totais').innerHTML = `<span class="c disponivel">${t.disponiveis}<small>disponíveis</small></span>
      <span class="c em_uso">${t.em_uso}<small>em uso</small></span><span class="c manutencao">${t.manutencao}<small>manutenção</small></span>
      <span class="c vaga">${t.vagas}<small>vagas</small></span>`;
    $('#m-grade').innerHTML = dados.posicoes.map((p) => `
      <div class="m-pos ${p.status}"><div class="m-num">${p.numero}</div><div class="m-corpo">
        ${p.viatura_id ? `<div class="m-pref">${esc(p.prefixo || p.placa)}</div>
          <div class="m-mod">${p.tipo === 'temporaria' ? `<i>${esc(p.setor_origem)}</i> ` : ''}${esc(p.modelo)}</div>
          ${p.prefixo ? `<div class="m-placa">${esc(p.placa)}</div>` : ''}` : ''}
        <div class="m-est">${STATUS[p.status]}</div>
        ${p.status === 'em_uso' ? `<div class="m-info"><b>${esc(nomeMil(p.motorista_posto, p.motorista_nome))}</b><span>${esc(p.missao)}</span><span>Saída ${hora(p.saida_em)} · ${decorrido(p.saida_em)}</span></div>` : ''}
        ${p.status === 'manutencao' ? `<div class="m-info"><span>${esc(p.manutencao_motivo)}</span></div>` : ''}
      </div></div>`).join('');
    ajustarGrade();
  }
  async function carregar() {
    try {
      const novo = await Local.chamar('GET', '/api/painel');
      const chave = JSON.stringify({ s: novo.servico, p: novo.posicoes });
      if (chave !== assinaturaDados) { assinaturaDados = chave; dados = novo; render(); }
    } catch (e) { console.error(e); }
  }
  const canal = 'BroadcastChannel' in window ? new BroadcastChannel('claviculario') : null;
  canal && (canal.onmessage = carregar);
  window.addEventListener('storage', (e) => { if (e.key === 'claviculario-ping') carregar(); });
  window.addEventListener('message', (e) => { if (e.data === 'atualizar') carregar(); });
  $('#m-tela-cheia').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  document.addEventListener('fullscreenchange', () => { $('#m-tela-cheia').hidden = !!document.fullscreenElement; });
  window.addEventListener('resize', ajustarGrade);
  relogio(); setInterval(relogio, 1000);
  setInterval(render, 30000);   // atualiza o "tempo fora"
  setInterval(carregar, 3000);  // garantia: confere o banco a cada 3 s
  carregar();
}

// ---------- partida ----------
(async () => {
  if (!('indexedDB' in window)) {
    document.body.innerHTML = '<p style="padding:24px;font:18px system-ui">Este navegador não permite guardar dados. Abra o arquivo no <b>Google Chrome</b> ou no <b>Microsoft Edge</b>.</p>';
    return;
  }
  try { await Local.carregar(); } catch (e) {
    document.body.innerHTML = `<p style="padding:24px;font:18px system-ui">Não foi possível abrir o banco de dados do navegador (${esc(e.message)}).<br>Abra o arquivo no <b>Google Chrome</b> ou no <b>Microsoft Edge</b>, fora do modo anônimo.</p>`;
    return;
  }
  if (location.hash === '#monitor') return iniciarMonitor();
  try { navigator.storage?.persist?.(); } catch { /* */ }
  iniciar();
  const ult = ultimoBackup(), E = Local.estado();
  if (E.cautelas.length && (!ult || Date.now() - new Date(ult) > 7 * 864e5)) setTimeout(() => aviso('Lembrete: faça o backup semanal em "Backup"', 'erro'), 1500);
})();

  </script>
